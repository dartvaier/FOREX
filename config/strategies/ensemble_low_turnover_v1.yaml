name: ensemble-low-turnover-v1
strategy_id: ENSEMBLE-LOW-TURNOVER-V1
symbol: EURUSD

models:
  - id: time-series-momentum
    weight: 1.0
    params:
      lookback: 96
      score_scale: 0.01
      pip_size: 0.00010

  - id: ema-trend
    weight: 1.0
    params:
      fast_period: 20
      slow_period: 50
      score_scale: 0.0010
      pip_size: 0.00010

blend:
  method: weighted_mean
  min_active_models: 2
  min_conviction: 0.0

signal_policy:
  enter_long: 0.40
  enter_short: -0.40
  exit_long_below: 0.05
  exit_short_above: -0.05

cost_gate:
  cost_estimate_pips: 3.7
  safety_factor: 1.0
