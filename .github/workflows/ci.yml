name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest (non-integration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install unit-test dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow pytest
      - name: Run unit tests
        run: python -m pytest -m "not integration" -q --tb=short
